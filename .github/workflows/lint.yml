name: Lua checks

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lua-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 lua-check luajit ripgrep

      - name: Verify source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.lua')
            ./scripts/verify.sh "${changed[@]}"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BEFORE_SHA...HEAD" -- '*.lua')
            ./scripts/verify.sh "${changed[@]}"
          else
            ./scripts/verify.sh
          fi
